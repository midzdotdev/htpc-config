# Dormant NVIDIA MX550. nouveau's GSP support for Turing is broken: any process
# that opens /dev/dri/card1 (rustdesk, OBS, and friends) triggers an endless
# wake/fail loop that pegs the fan. Keep the dGPU invisible.
#
# Blacklisting alone leaves the card fully powered, because the kernel keeps
# runtime PM at "on" for driverless devices -- see 99-pci-pm.rules, which is the
# other half of this and the part that actually stops the fan.
blacklist nouveau
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
options nouveau modeset=0
